
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030303">
<title>yzycat</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --bg: #030303;
    --white: #f4f4f4;
    --muted: #666;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: var(--bg);
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

body.entered {
    overflow-x: hidden;
    overflow-y: auto;
}

/* MAIN WEBSITE */

#website {
    min-height: 100svh;
    position: relative;
    background:
        radial-gradient(ellipse at 50% 45%, #111111 0%, transparent 55%),
        #030303;
    display: flex;
    flex-direction: column;
    padding: 35px 5%;
}

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
}

.logo {
    color: white;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -1.5px;
    text-decoration: none;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 34px;
}

.nav-links a {
    text-decoration: none;
    color: #777;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.8px;
    transition: color .25s ease;
}

.nav-links a:hover {
    color: white;
}

.hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: relative;
}

.hero h1 {
    font-size: clamp(65px, 14vw, 180px);
    font-weight: 800;
    letter-spacing: -.105em;
    line-height: .85;
    color: #f5f5f5;
    user-select: none;
    animation: heroReveal 1.2s cubic-bezier(.2,.8,.2,1) both;
}

.hero h1 span {
    color: #777;
}

@keyframes heroReveal {
    from {
        opacity: 0;
        transform: translateY(25px);
        filter: blur(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

.footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #555;
    font-size: 9px;
    letter-spacing: 2px;
}

/* EXTRA SECTIONS */

.content-section {
    min-height: 70vh;
    padding: 100px 5%;
    border-top: 1px solid #171717;
}

.content-section h2 {
    font-size: clamp(35px, 6vw, 75px);
    letter-spacing: -4px;
    font-weight: 600;
}

.content-section p {
    color: #777;
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.8;
}

/* OPENING */

#opening {
    position: fixed;
    inset: 0;
    z-index: 1000;
    overflow: hidden;
    background: transparent;
    touch-action: none;
}

/* SCREEN PANELS */

.panel {
    position: absolute;
    width: 100%;
    height: 50.5%;
    left: 0;
    background:
        radial-gradient(ellipse at center, #0b0b0b 0%, #030303 70%);
    will-change: transform;
}

#top {
    top: 0;
    clip-path: polygon(
        0 0, 100% 0, 100% 100%,
        96% 99.3%, 92% 100%,
        88% 99.4%, 84% 100%,
        80% 99.3%, 76% 100%,
        72% 99.4%, 68% 100%,
        64% 99.3%, 60% 100%,
        56% 99.4%, 52% 100%,
        48% 99.3%, 44% 100%,
        40% 99.4%, 36% 100%,
        32% 99.3%, 28% 100%,
        24% 99.4%, 20% 100%,
        16% 99.3%, 12% 100%,
        8% 99.4%, 4% 100%,
        0 99.3%
    );
}

#bottom {
    bottom: 0;
    clip-path: polygon(
        0 0,
        4% .7%, 8% 0,
        12% .6%, 16% 0,
        20% .7%, 24% 0,
        28% .6%, 32% 0,
        36% .7%, 40% 0,
        44% .6%, 48% 0,
        52% .7%, 56% 0,
        60% .6%, 64% 0,
        68% .7%, 72% 0,
        76% .6%, 80% 0,
        84% .7%, 88% 0,
        92% .6%, 96% 0,
        100% .7%, 100% 100%, 0 100%
    );
}

/* CENTER LINE */

#pullLine {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    background: #303030;
    transform: translateY(-50%);
    pointer-events: none;
    will-change: transform;
}

#pullLine::before,
#pullLine::after {
    content: "";
    position: absolute;
    top: -1px;
    height: 3px;
    width: 20%;
    opacity: .4;
    background: linear-gradient(90deg, transparent, #aaa);
}

#pullLine::before {
    left: 0;
}

#pullLine::after {
    right: 0;
    transform: rotate(180deg);
}

/* HANDLE */

#handle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    border: 1px solid #414141;
    border-radius: 50%;
    background: #090909;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
    z-index: 5;
    box-shadow:
        0 0 0 5px #ffffff04,
        0 5px 25px #000;
    transition:
        border-color .25s,
        box-shadow .25s;
}

#handle:hover {
    border-color: #aaa;
    box-shadow:
        0 0 0 6px #ffffff08,
        0 0 30px #ffffff0d;
}

#handle:active {
    cursor: grabbing;
}

#handle .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #aaa;
    transition: .2s;
}

#handle:hover .dot {
    background: white;
    transform: scale(1.4);
}

#opening.dragging #handle {
    border-color: #ddd;
}

#opening.dragging #handle .dot {
    background: white;
    transform: scale(1.5);
}

/* RELEASE */

#opening.releasing .panel {
    transition: transform 1.1s cubic-bezier(.76,0,.24,1);
}

#opening.releasing #handle {
    transition: opacity .3s ease;
    opacity: 0;
}

#opening.releasing #pullLine {
    transition: opacity .3s ease;
    opacity: 0;
}

#opening.finished {
    display: none;
}

/* MOBILE */

@media(max-width: 600px) {
    #website {
        padding: 25px 22px;
    }

    .nav-links {
        gap: 15px;
    }

    .nav-links a {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .logo {
        font-size: 17px;
    }

    .hero h1 {
        letter-spacing: -.09em;
    }

    .footer {
        font-size: 7px;
    }
}

@media(prefers-reduced-motion: reduce) {
    .hero h1 {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- WEBSITE -->

<main id="website">

    <header class="navbar">
        <a href="#" class="logo">yzycat.</a>

        <nav class="nav-links">
            <a href="#about">ABOUT</a>
            <a href="#projects">PROJECTS</a>
            <a href="#contact">CONTACT</a>
        </nav>
    </header>

    <section class="hero">
        <h1>yzycat<span>.</span></h1>
    </section>

    <footer class="footer">
        <span>© 2026 YZYCAT</span>
        <span>INDEPENDENTLY CREATED</span>
    </footer>

</main>

<section class="content-section" id="about">
    <h2>About.</h2>
    <p>A little corner of the internet.</p>
</section>

<section class="content-section" id="projects">
    <h2>Projects.</h2>
</section>

<section class="content-section" id="contact">
    <h2>Contact.</h2>
</section>

<!-- OPENING SCREEN -->

<div id="opening">

    <div class="panel" id="top"></div>
    <div class="panel" id="bottom"></div>

    <div id="pullLine"></div>

    <div id="handle">
        <div class="dot"></div>
    </div>

</div>

<script>
const opening = document.getElementById("opening");
const topPanel = document.getElementById("top");
const bottomPanel = document.getElementById("bottom");
const handle = document.getElementById("handle");
const pullLine = document.getElementById("pullLine");

let dragging = false;
let opened = false;
let startY = 0;
let pull = 0;
let pointerId = null;

const getThreshold = () => window.innerHeight * 0.23;
const getMaxPull = () => window.innerHeight * 0.48;

function updatePull(value) {
    const max = getMaxPull();

    // Elastic resistance at the end of the pull.
    const raw = Math.max(0, value);
    const resisted = raw > max
        ? max + (raw - max) * 0.12
        : raw;

    pull = Math.min(resisted, max + 30);

    const progress = Math.min(pull / max, 1);
    const separation = pull * 0.92;

    topPanel.style.transform =
        `translate3d(0, ${-separation}px, 0)`;

    bottomPanel.style.transform =
        `translate3d(0, ${separation}px, 0)`;

    handle.style.top =
        `calc(50% + ${pull}px)`;

    handle.style.scale =
        `${1 + progress * 0.12}`;

    pullLine.style.transform =
        `translate3d(0, ${pull}px, 0) scaleX(${1 - progress * .18})`;
}

function restore() {
    opening.classList.remove("dragging");

    topPanel.style.transition =
        "transform .8s cubic-bezier(.2,.8,.2,1)";

    bottomPanel.style.transition =
        "transform .8s cubic-bezier(.2,.8,.2,1)";

    handle.style.transition =
        "top .8s cubic-bezier(.2,.8,.2,1), scale .3s";

    pullLine.style.transition =
        "transform .8s cubic-bezier(.2,.8,.2,1)";

    updatePull(0);

    setTimeout(() => {
        if (opened) return;

        topPanel.style.transition = "";
        bottomPanel.style.transition = "";
        handle.style.transition = "";
        pullLine.style.transition = "";
    }, 850);
}

function reveal() {
    if (opened) return;

    opened = true;
    dragging = false;

    opening.classList.remove("dragging");
    opening.classList.add("releasing");

    topPanel.style.transform =
        "translate3d(0,-110vh,0)";

    bottomPanel.style.transform =
        "translate3d(0,110vh,0)";

    setTimeout(() => {
        opening.classList.add("finished");
        document.body.classList.add("entered");
    }, 1150);
}

handle.addEventListener("pointerdown", (event) => {
    if (opened || dragging) return;

    dragging = true;
    pointerId = event.pointerId;
    startY = event.clientY;
    
    handle.setPointerCapture(pointerId);
    opening.classList.add("dragging");
});

handle.addEventListener("pointermove", (event) => {
    if (!dragging || opened || event.pointerId !== pointerId) return;

    updatePull(event.clientY - startY);
});

function release(event) {
    if (!dragging || opened) return;
    if (event && event.pointerId !== pointerId) return;

    dragging = false;
    pointerId = null;

    if (pull >= getThreshold()) {
        reveal();
    } else {
        restore();
    }
}

handle.addEventListener("pointerup", release);
handle.addEventListener("pointercancel", release);

// Prevent accidental selection and dragging.
handle.addEventListener("dragstart", e => e.preventDefault());

// Keep the transition centered if the viewport changes.
window.addEventListener("resize", () => {
    if (!dragging || opened) return;
    restore();
});
</script>

</body>
</html>
