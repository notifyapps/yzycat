<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yzycat</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #000;
    --fg: #f2f2f2;
    --mute: #8a8a8a;
    --line: #292929;
    --font: "Syne", "Helvetica Neue", Arial, sans-serif;
    --mx: 50%;
    --my: 50%;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { height: 100%; background: #000; }
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

a:focus-visible, button:focus-visible, #handle:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 4px;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

#website {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(32px, env(safe-area-inset-top, 0px)) 5% max(32px, env(safe-area-inset-bottom, 0px));
    background:
        radial-gradient(520px circle at var(--mx) var(--my), #ffffff14, transparent 70%),
        var(--bg);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
nav {
    display: flex;
    gap: 28px;
    font-size: 13px;
    letter-spacing: .04em;
}
nav a {
    color: var(--mute);
    text-decoration: none;
    position: relative;
    transition: color .2s;
}
nav a::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 1px;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
}
nav a:hover, nav a[aria-current] { color: var(--fg); }
nav a:hover::after, nav a[aria-current]::after { transform: scaleX(1); }

#sound {
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: 0;
    color: var(--mute);
    font: inherit;
    font-size: 13px;
    letter-spacing: .04em;
    cursor: pointer;
    transition: color .2s;
}
#sound:hover { color: var(--fg); }
#sound .bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
#sound .bars i {
    display: block;
    width: 2px;
    height: 3px;
    background: currentColor;
    transition: height .3s;
}
#sound.on { color: var(--fg); }
#sound.on .bars i { animation: eq .9s ease-in-out infinite alternate; }
#sound.on .bars i:nth-child(2) { animation-delay: -.3s; }
#sound.on .bars i:nth-child(3) { animation-delay: -.6s; }
#sound.on .bars i:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }

.hero h1 {
    font-weight: 800;
    font-size: clamp(64px, 19vw, 280px);
    line-height: .85;
    letter-spacing: -.045em;
    margin-left: -.04em;
}
.hero h1 span {
    display: inline-block;
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
}
.hero h1 span:hover { transform: translateY(-.06em); }
.hero p {
    margin-top: 22px;
    color: var(--mute);
    font-weight: 500;
    font-size: clamp(14px, 1.6vw, 18px);
}

body:not(.landed) .hero h1 span { opacity: 0; }

.top, .hero p {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .9s ease .1s, transform .9s ease .1s;
}
body.landed .top, body.landed .hero p { opacity: 1; transform: none; }
body.landed .hero p { transition-delay: .35s; }

#intro {
    position: fixed;
    inset: 0;
    z-index: 11;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 56px;
}
#veil { position: fixed; inset: 0; z-index: 10; background: var(--bg); transition: opacity .9s ease; }
#veil.done { opacity: 0; pointer-events: none; }
#intro.done { pointer-events: none; }
#intro.done #slider, #intro.done #hint { opacity: 0; transition: opacity .4s ease; }

#mark {
    font-weight: 800;
    font-size: clamp(36px, 9vw, 64px);
    letter-spacing: -.045em;
    line-height: .85;
    display: inline-block;
    white-space: nowrap;
    transform-origin: 0 0;
    opacity: .12;
    filter: blur(8px);
}

#slider {
    position: relative;
    width: min(320px, 65vw);
    height: 2px;
    background: var(--line);
    border-radius: 10px;
    touch-action: none;
}

#slider::before { content: ""; position: absolute; inset: -22px -10px; }

#progress {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: var(--fg);
    border-radius: 10px;
}
#handle {
    position: absolute;
    left: 0;
    top: 50%;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--fg);
    transform: translate(-50%, -50%);
    cursor: grab;
    touch-action: none;
    box-shadow: 0 0 15px #ffffff18;
    transition: box-shadow .2s;
}
#handle:hover { box-shadow: 0 0 24px #ffffff55; }
#handle:active { cursor: grabbing; }
#hint {
    color: var(--mute);
    font-size: 12px;
    letter-spacing: .04em;
    animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: .35; } }

@media (max-width: 600px) {
    nav { gap: 20px; }
}
@media (prefers-reduced-motion: reduce) {
    #veil, #mark, .top, .hero p { transition: none !important; }
    #hint, #sound.on .bars i { animation: none !important; }
}
</style>
</head>

<body>

<audio id="music" src="yzymusic/7-Donda-PABLO-FKYBJQ.mp3" loop preload="auto"></audio>

<main id="website">
    <div class="top">
        <nav aria-label="Main">
            <a href="#" aria-current="page">home</a>
            <a href="#">work</a>
            <a href="#">contact</a>
        </nav>
        <button id="sound" type="button" aria-pressed="false" aria-label="Toggle music">
            <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span id="soundLabel">sound off</span>
        </button>
    </div>

    <header class="hero">
        <h1 aria-label="yzycat"><span aria-hidden="true">y</span><span aria-hidden="true">z</span><span aria-hidden="true">y</span><span aria-hidden="true">c</span><span aria-hidden="true">a</span><span aria-hidden="true">t</span></h1>
        <p>Welcome in.</p>
    </header>
</main>

<div id="veil"></div>

<div id="intro">
    <div id="mark" aria-hidden="true">yzycat</div>
    <div id="slider">
        <div id="progress"></div>
        <div id="handle" role="slider" tabindex="0" aria-label="Slide to enter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
    <div id="hint">slide to enter</div>
</div>

<script>
const intro = document.getElementById("intro");
const veil = document.getElementById("veil");
const slider = document.getElementById("slider");
const handle = document.getElementById("handle");
const progress = document.getElementById("progress");
const mark = document.getElementById("mark");
const site = document.getElementById("website");
const music = document.getElementById("music");
const soundBtn = document.getElementById("sound");
const soundLabel = document.getElementById("soundLabel");

const VOLUME = 0.6;
let dragging = false, completed = false, pointerId = null, pct = 0;
let wantsSound = true, fadeTimer = null;

try { if (localStorage.getItem("yzycat-sound") === "off") wantsSound = false; } catch (e) {}

function setSoundUI(on) {
    soundBtn.classList.toggle("on", on);
    soundBtn.setAttribute("aria-pressed", String(on));
    soundLabel.textContent = on ? "sound on" : "sound off";
}

function fadeTo(target, ms, done) {
    clearInterval(fadeTimer);
    const start = music.volume, t0 = performance.now();
    fadeTimer = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        music.volume = Math.max(0, Math.min(1, start + (target - start) * k));
        if (k >= 1) { clearInterval(fadeTimer); if (done) done(); }
    }, 30);
}

function startMusic() {
    if (!wantsSound) return setSoundUI(false);
    music.volume = 0;
    const p = music.play();
    if (p && p.then) {
        p.then(() => { setSoundUI(true); fadeTo(VOLUME, 2500); })
         .catch(() => setSoundUI(false));
    }
}

soundBtn.addEventListener("click", () => {
    if (music.paused) {
        wantsSound = true;
        music.volume = 0;
        music.play().then(() => { setSoundUI(true); fadeTo(VOLUME, 800); }).catch(() => setSoundUI(false));
    } else {
        wantsSound = false;
        setSoundUI(false);
        fadeTo(0, 500, () => music.pause());
    }
    try { localStorage.setItem("yzycat-sound", wantsSound ? "on" : "off"); } catch (e) {}
});

document.addEventListener("visibilitychange", () => {
    if (!completed || !wantsSound) return;
    if (document.hidden) music.pause();
    else music.play().catch(() => {});
});

function render(p, animate) {
    pct = Math.max(0, Math.min(p, 100));
    const t = animate ? ".35s ease" : "";
    handle.style.transition = animate ? "left " + t : "";
    progress.style.transition = animate ? "width " + t : "";
    handle.style.left = pct + "%";
    progress.style.width = pct + "%";
    handle.setAttribute("aria-valuenow", Math.round(pct));
    mark.style.opacity = .12 + pct / 100 * .88;
    mark.style.filter = "blur(" + (8 - pct / 100 * 8) + "px)";
}

function fromPointer(x) {
    const r = slider.getBoundingClientRect();
    return (x - r.left) / r.width * 100;
}

function complete() {
    if (completed) return;
    completed = true;
    dragging = false;
    render(100, true);
    intro.classList.add("done");
    veil.classList.add("done");
    document.body.style.overflow = "auto";
    startMusic();
    flyToTitle();
}

function flyToTitle() {
    const h1 = document.querySelector(".hero h1");
    const first = h1.querySelector("span").getBoundingClientRect();
    const m = mark.getBoundingClientRect();
    const toSize = parseFloat(getComputedStyle(h1).fontSize);
    const fromSize = parseFloat(getComputedStyle(mark).fontSize);
    let landed = false;
    const land = () => {
        if (landed) return;
        landed = true;
        document.body.classList.add("landed");
        mark.style.visibility = "hidden";
        setTimeout(() => { intro.remove(); veil.remove(); }, 60);
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return land();

    mark.style.filter = "none";
    mark.style.opacity = 1;
    mark.style.position = "fixed";
    mark.style.margin = "0";
    mark.style.transform = "none";
    mark.style.left = m.left + "px";
    mark.style.top = m.top + "px";
    mark.style.fontSize = fromSize + "px";
    mark.getBoundingClientRect();

    mark.style.transition = "left 1.1s cubic-bezier(.65,0,.25,1), top 1.1s cubic-bezier(.65,0,.25,1), font-size 1.1s cubic-bezier(.65,0,.25,1)";
    mark.style.left = first.left + "px";
    mark.style.top = first.top + "px";
    mark.style.fontSize = toSize + "px";
    mark.addEventListener("transitionend", e => { if (e.propertyName === "font-size") land(); }, { once: true });
    setTimeout(land, 1500);
}

function settle() {
    if (completed) return;
    if (pct >= 98) complete(); else render(0, true);
}

handle.addEventListener("pointerdown", e => {
    if (completed || dragging) return;
    dragging = true;
    pointerId = e.pointerId;
    handle.setPointerCapture(pointerId);
});
handle.addEventListener("pointermove", e => {
    if (!dragging || completed || e.pointerId !== pointerId) return;
    render(fromPointer(e.clientX));
    if (pct >= 98) complete();
});
function release(e) {
    if (!dragging || e.pointerId !== pointerId) return;
    dragging = false;
    pointerId = null;
    settle();
}
handle.addEventListener("pointerup", release);
handle.addEventListener("pointercancel", release);

handle.addEventListener("keydown", e => {
    if (completed) return;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") render(pct + 10, true);
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") render(pct - 10, true);
    else if (e.key === "Enter" || e.key === "End") render(100, true);
    else if (e.key === "Home") render(0, true);
    else return;
    e.preventDefault();
    if (pct >= 98) complete();
});

site.addEventListener("pointermove", e => {
    site.style.setProperty("--mx", e.clientX + "px");
    site.style.setProperty("--my", e.clientY + "px");
});
</script>

</body>
</html>
