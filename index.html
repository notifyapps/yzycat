
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>untitled.</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#website {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#website h1 {
    font-size: clamp(50px, 9vw, 110px);
    font-weight: 400;
    letter-spacing: -6px;
}

#website nav {
    display: flex;
    gap: 35px;
    margin-top: 35px;
}

#website a {
    color: #777;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: color .2s;
}

#website a:hover {
    color: white;
}

#opening {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.panel {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    background: #000;
    transition: none;
}

#top {
    top: 0;
}

#bottom {
    bottom: 0;
}

#pullLine {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: 1px;
    background: #292929;
    transform: translateY(-50%);
    pointer-events: none;
}

#handle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 48px;
    height: 48px;
    transform: translate(-50%, -50%);
    border: 1px solid #444;
    border-radius: 50%;
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    pointer-events: auto;
    touch-action: none;
    transition: border-color .2s;
}

#handle:hover {
    border-color: #aaa;
}

#handle:active {
    cursor: grabbing;
}

#handle::after {
    content: "";
    width: 5px;
    height: 5px;
    background: #aaa;
    border-radius: 50%;
}

#opening.opening {
    pointer-events: none;
}

#opening.finished {
    display: none;
}
</style>
</head>

<body>

<main id="website">
    <h1>untitled.</h1>

    <nav>
        <a href="#">ABOUT</a>
        <a href="#">WORK</a>
        <a href="#">CONTACT</a>
    </nav>
</main>

<div id="opening">
    <div class="panel" id="top"></div>
    <div class="panel" id="bottom"></div>

    <div id="pullLine"></div>
    <div id="handle"></div>
</div>

<script>
const opening = document.getElementById("opening");
const topPanel = document.getElementById("top");
const bottomPanel = document.getElementById("bottom");
const line = document.getElementById("pullLine");
const handle = document.getElementById("handle");

let dragging = false;
let startY = 0;
let pull = 0;
let opened = false;

const maxPull = window.innerHeight * 0.48;
const threshold = window.innerHeight * 0.25;

function update(value) {
    pull = Math.max(0, Math.min(value, maxPull));

    const progress = pull / maxPull;

    topPanel.style.transform =
        `translateY(${-pull * 0.85}px)`;

    bottomPanel.style.transform =
        `translateY(${pull * 0.85}px)`;

    line.style.transform =
        `translateY(${pull}px)`;

    handle.style.top =
        `calc(50% + ${pull}px)`;

    handle.style.transform =
        `translate(-50%, -50%) scale(${1 + progress * 0.15})`;

    handle.style.borderColor =
        progress > 0.5 ? "#aaa" : "#444";
}

function reset() {
    topPanel.style.transition = "transform .7s cubic-bezier(.2,.8,.2,1)";
    bottomPanel.style.transition = "transform .7s cubic-bezier(.2,.8,.2,1)";
    line.style.transition = "transform .7s ease";
    handle.style.transition = "top .7s ease, transform .7s ease";

    update(0);

    setTimeout(() => {
        topPanel.style.transition = "";
        bottomPanel.style.transition = "";
        line.style.transition = "";
        handle.style.transition = "";
    }, 750);
}

handle.addEventListener("pointerdown", (e) => {
    if (opened) return;

    dragging = true;
    startY = e.clientY;
    handle.setPointerCapture(e.pointerId);
});

handle.addEventListener("pointermove", (e) => {
    if (!dragging || opened) return;

    update(e.clientY - startY);
});

function finish() {
    if (!dragging) return;

    dragging = false;

    if (pull >= threshold) {
        opened = true;
        opening.classList.add("opening");

        topPanel.style.transition =
            "transform .85s cubic-bezier(.7,0,.2,1)";

        bottomPanel.style.transition =
            "transform .85s cubic-bezier(.7,0,.2,1)";

        line.style.transition = "opacity .4s ease";
        handle.style.transition = "opacity .3s ease";

        topPanel.style.transform = "translateY(-110vh)";
        bottomPanel.style.transform = "translateY(110vh)";

        line.style.opacity = "0";
        handle.style.opacity = "0";

        setTimeout(() => {
            opening.classList.add("finished");
            document.body.style.overflow = "auto";
        }, 900);
    } else {
        reset();
    }
}

handle.addEventListener("pointerup", finish);
handle.addEventListener("pointercancel", finish);
</script>

</body>
</html>
