
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yzycat.</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

#website {
    position: fixed;
    inset: 0;
    background: #000;
}

.home {
    position: absolute;
    top: 32px;
    left: 5%;
}

.home a {
    color: #888;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: color .2s;
}

.home a:hover {
    color: white;
}

#intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .8s ease;
}

#slider {
    position: relative;
    width: min(320px, 65vw);
    height: 2px;
    background: #292929;
    border-radius: 10px;
}

#progress {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #fff;
    border-radius: 10px;
}

#handle {
    position: absolute;
    left: 0;
    top: 50%;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #f2f2f2;
    transform: translate(-50%, -50%);
    cursor: grab;
    touch-action: none;
    box-shadow: 0 0 15px #ffffff18;
    transition: box-shadow .2s;
}

#handle:hover {
    box-shadow: 0 0 22px #ffffff55;
}

#handle:active {
    cursor: grabbing;
}

#intro.done {
    opacity: 0;
    pointer-events: none;
}

@media (max-width: 600px) {
    .home {
        left: 25px;
        top: 25px;
    }
}
</style>
</head>

<body>

<main id="website">
    <nav class="home">
        <a href="#">HOME</a>
    </nav>
</main>

<div id="intro">
    <div id="slider">
        <div id="progress"></div>
        <div id="handle"></div>
    </div>
</div>

<script>
const intro = document.getElementById("intro");
const slider = document.getElementById("slider");
const handle = document.getElementById("handle");
const progress = document.getElementById("progress");

let dragging = false;
let completed = false;
let pointerId = null;
let position = 0;

function update(x) {
    const rect = slider.getBoundingClientRect();
    const max = rect.width;

    position = Math.max(0, Math.min(x - rect.left, max));

    const percent = position / max * 100;

    handle.style.left = percent + "%";
    progress.style.width = percent + "%";

    if (percent >= 98) {
        complete();
    }
}

function complete() {
    if (completed) return;

    completed = true;
    dragging = false;

    handle.style.left = "100%";
    progress.style.width = "100%";

    intro.classList.add("done");

    setTimeout(() => {
        intro.remove();
        document.body.style.overflow = "auto";
    }, 850);
}

handle.addEventListener("pointerdown", e => {
    if (completed || dragging) return;

    dragging = true;
    pointerId = e.pointerId;
    handle.setPointerCapture(pointerId);
});

handle.addEventListener("pointermove", e => {
    if (!dragging || completed || e.pointerId !== pointerId) return;

    update(e.clientX);
});

function release(e) {
    if (!dragging || completed || e.pointerId !== pointerId) return;

    dragging = false;
    pointerId = null;

    if (position < slider.clientWidth * .98) {
        handle.style.transition = "left .35s ease";
        progress.style.transition = "width .35s ease";

        position = 0;
        handle.style.left = "0%";
        progress.style.width = "0%";

        setTimeout(() => {
            handle.style.transition = "";
            progress.style.transition = "";
        }, 400);
    }
}

handle.addEventListener("pointerup", release);
handle.addEventListener("pointercancel", release);
</script>

</body>
</html>
