
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>yzycat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050505;
    --fg: #ededed;
    --muted: #777;
    --line: #252525;
    --font: "Syne", sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
}

button, a {
    font: inherit;
}

button:focus-visible, a:focus-visible {
    outline: 1px solid white;
    outline-offset: 5px;
}

/* BACKGROUND */

#website {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 38px 5.5%;
    opacity: 0;
    transition: opacity 1s ease;
    background:
        radial-gradient(ellipse at 50% 45%, #ffffff08, transparent 65%),
        #050505;
}

body.landed #website {
    opacity: 1;
}

#grain {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    pointer-events: none;
    z-index: 5;
    opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    animation: grain .25s steps(2) infinite;
}

@keyframes grain {
    0% { transform: translate(0,0); }
    25% { transform: translate(1%,-1%); }
    50% { transform: translate(-1%,1%); }
    75% { transform: translate(1%,1%); }
    100% { transform: translate(-1%,-1%); }
}

/* NAVIGATION */

nav {
    display: flex;
    align-items: center;
    gap: 30px;
}

nav a {
    text-decoration: none;
    color: #666;
    font-size: 12px;
    transition: color .25s ease;
}

nav a:hover,
nav a.active {
    color: white;
}

.nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #555;
    font-size: 10px;
    letter-spacing: .08em;
}

.status-dot {
    width: 5px;
    height: 5px;
    background: #b6b6b6;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffffff70;
}

/* HERO */

.hero {
    position: relative;
}

.hero h1 {
    font-size: clamp(85px, 19vw, 260px);
    font-weight: 800;
    line-height: .78;
    letter-spacing: -.085em;
    margin-left: -.055em;
    white-space: nowrap;
}

.hero h1 span {
    display: inline-block;
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
}

.hero h1 span:hover {
    transform: translateY(-8px);
}

.hero-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 35px;
}

.hero-bottom p {
    font-size: 13px;
    color: #777;
    letter-spacing: .01em;
}

.hero-bottom .index {
    font-size: 10px;
    color: #444;
    letter-spacing: .1em;
}

/* FOOTER */

footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #555;
    font-size: 10px;
    letter-spacing: .04em;
}

footer a {
    color: #777;
    text-decoration: none;
    transition: color .2s;
}

footer a:hover {
    color: white;
}

/* MUSIC */

#music {
    position: fixed;
    right: 5.5%;
    bottom: 75px;
    z-index: 8;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity .8s ease;
}

body.landed #music {
    opacity: 1;
}

#music button {
    background: none;
    border: 1px solid #303030;
    color: #aaa;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 11px;
    transition: border-color .2s, color .2s;
}

#music button:hover {
    border-color: #888;
    color: white;
}

.music-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.music-name {
    color: #aaa;
    font-size: 10px;
}

.music-state {
    color: #555;
    font-size: 9px;
    letter-spacing: .1em;
}

.music-bars {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 12px;
}

.music-bars i {
    display: block;
    width: 2px;
    height: 3px;
    background: #aaa;
}

body.playing .music-bars i {
    animation: equalize .7s ease-in-out infinite alternate;
}

.music-bars i:nth-child(2) { animation-delay: -.3s; }
.music-bars i:nth-child(3) { animation-delay: -.5s; }
.music-bars i:nth-child(4) { animation-delay: -.2s; }

@keyframes equalize {
    from { height: 3px; }
    to { height: 12px; }
}

/* INTRO */

#veil {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #050505;
    transition: opacity 1s ease, visibility 1s;
}

#intro {
    position: fixed;
    inset: 0;
    z-index: 11;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 55px;
}

#mark {
    font-size: clamp(42px, 9vw, 68px);
    font-weight: 800;
    letter-spacing: -.075em;
    line-height: .85;
    white-space: nowrap;
    opacity: .15;
    filter: blur(8px);
    transform-origin: top left;
}

#slider {
    position: relative;
    width: min(310px, 65vw);
    height: 2px;
    background: #282828;
    border-radius: 10px;
    touch-action: none;
}

#slider::before {
    content: "";
    position: absolute;
    inset: -22px -10px;
}

#progress {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: white;
    border-radius: 10px;
}

#handle {
    position: absolute;
    left: 0;
    top: 50%;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #eee;
    transform: translate(-50%, -50%);
    cursor: grab;
    touch-action: none;
    box-shadow: 0 0 20px #ffffff25;
}

#handle:active {
    cursor: grabbing;
}

#hint {
    color: #555;
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: lowercase;
}

#intro.done {
    pointer-events: none;
}

#intro.done #slider,
#intro.done #hint {
    opacity: 0;
    transition: opacity .4s;
}

/* RESPONSIVE */

@media(max-width: 600px) {
    #website {
        padding: 28px 7%;
    }

    .hero h1 {
        font-size: 19vw;
    }

    nav {
        gap: 22px;
    }

    .hero-bottom {
        margin-top: 25px;
    }

    #music {
        right: 7%;
        bottom: 75px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main id="website">

    <nav>
        <a href="#" class="active">home</a>
        <a href="work.html">work</a>
        <a href="mailto:hello@yzycat.com">contact</a>

        <div class="nav-right">
            <span class="status-dot"></span>
            AVAILABLE
        </div>
    </nav>

    <header class="hero">
        <h1 aria-label="yzycat">
            <span>y</span><span>z</span><span>y</span><span>c</span><span>a</span><span>t</span>
        </h1>

        <div class="hero-bottom">
            <p>Welcome in.</p>
            <span class="index">001 — 2026</span>
        </div>
    </header>

    <footer>
        <span>© 2026 yzycat</span>
        <a href="https://github.com/">github ↗</a>
    </footer>

</main>

<div id="grain"></div>
<div id="veil"></div>

<div id="intro">
    <div id="mark">yzycat</div>

    <div id="slider">
        <div id="progress"></div>
        <div id="handle" role="slider" tabindex="0"
             aria-label="Slide to enter"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="0">
        </div>
    </div>

    <div id="hint">slide to enter</div>
</div>

<div id="music">
    <div class="music-bars">
        <i></i><i></i><i></i><i></i>
    </div>

    <div class="music-info">
        <span class="music-name">PABLO</span>
        <span class="music-state" id="musicState">PAUSED</span>
    </div>

    <button id="musicToggle" aria-label="Play music">▶</button>
</div>

<audio id="audio" src="yzymusic/PABLO.mp3" loop preload="auto"></audio>

<script>
const intro = document.getElementById("intro");
const veil = document.getElementById("veil");
const slider = document.getElementById("slider");
const handle = document.getElementById("handle");
const progress = document.getElementById("progress");
const mark = document.getElementById("mark");
const audio = document.getElementById("audio");
const musicToggle = document.getElementById("musicToggle");
const musicState = document.getElementById("musicState");

let dragging = false;
let completed = false;
let pointerId = null;
let pct = 0;

audio.volume = 0.35;

function render(p, animate = false) {
    pct = Math.max(0, Math.min(p, 100));

    handle.style.transition = animate ? "left .35s ease" : "";
    progress.style.transition = animate ? "width .35s ease" : "";

    handle.style.left = pct + "%";
    progress.style.width = pct + "%";

    handle.setAttribute("aria-valuenow", Math.round(pct));

    mark.style.opacity = .15 + pct / 100 * .85;
    mark.style.filter = `blur(${8 - pct / 100 * 8}px)`;
}

function fromPointer(x) {
    const r = slider.getBoundingClientRect();
    return (x - r.left) / r.width * 100;
}

async function toggleMusic() {
    if (audio.paused) {
        try {
            await audio.play();
        } catch (error) {
            musicState.textContent = "UNAVAILABLE";
        }
    } else {
        audio.pause();
    }
}

function updateMusicUI() {
    const playing = !audio.paused;

    document.body.classList.toggle("playing", playing);
    musicToggle.textContent = playing ? "Ⅱ" : "▶";
    musicToggle.setAttribute("aria-label", playing ? "Pause music" : "Play music");
    musicState.textContent = playing ? "NOW PLAYING" : "PAUSED";
}

audio.addEventListener("play", updateMusicUI);
audio.addEventListener("pause", updateMusicUI);
audio.addEventListener("error", () => {
    musicState.textContent = "FILE NOT FOUND";
});

musicToggle.addEventListener("click", toggleMusic);

function complete() {
    if (completed) return;

    completed = true;
    dragging = false;

    render(100, true);

    intro.classList.add("done");

    document.body.classList.add("landed");

    audio.play().catch(() => {
        musicState.textContent = "CLICK TO PLAY";
    });

    flyToTitle();
}

function flyToTitle() {
    const h1 = document.querySelector(".hero h1");
    const first = h1.querySelector("span").getBoundingClientRect();
    const m = mark.getBoundingClientRect();

    const scale = parseFloat(getComputedStyle(h1).fontSize) /
                   parseFloat(getComputedStyle(mark).fontSize);

    function land() {
        mark.style.visibility = "hidden";
        veil.style.opacity = "0";
        veil.style.visibility = "hidden";

        setTimeout(() => {
            intro.remove();
            veil.remove();
        }, 1000);
    }

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
        land();
        return;
    }

    mark.style.transition = "transform 1.1s cubic-bezier(.65,0,.25,1)";
    mark.style.transform =
        `translate(${first.left - m.left}px, ${first.top - m.top}px) scale(${scale})`;

    mark.addEventListener("transitionend", e => {
        if (e.propertyName === "transform") land();
    }, { once: true });

    setTimeout(land, 1500);
}

function settle() {
    if (completed) return;

    if (pct >= 98) {
        complete();
    } else {
        render(0, true);
    }
}

handle.addEventListener("pointerdown", e => {
    if (completed || dragging) return;

    dragging = true;
    pointerId = e.pointerId;
    handle.setPointerCapture(pointerId);
});

handle.addEventListener("pointermove", e => {
    if (!dragging || completed || e.pointerId !== pointerId) return;

    render(fromPointer(e.clientX));

    if (pct >= 98) complete();
});

function release(e) {
    if (!dragging || e.pointerId !== pointerId) return;

    dragging = false;
    pointerId = null;
    settle();
}

handle.addEventListener("pointerup", release);
handle.addEventListener("pointercancel", release);

handle.addEventListener("keydown", e => {
    if (completed) return;

    if (e.key === "ArrowRight" || e.key === "ArrowUp") {
        render(pct + 10, true);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
        render(pct - 10, true);
    } else if (e.key === "Enter" || e.key === "End") {
        render(100, true);
    } else if (e.key === "Home") {
        render(0, true);
    } else {
        return;
    }

    e.preventDefault();

    if (pct >= 98) complete();
});
</script>

</body>
</html>
