
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yzycat.</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #030303;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#website {
    position: fixed;
    inset: 0;
    background: #030303;
    display: flex;
    align-items: center;
    justify-content: center;
}

.home {
    position: absolute;
    top: 35px;
    left: 5%;
}

.home a {
    color: #aaa;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: color .2s;
}

.home a:hover {
    color: white;
}

#opening {
    position: fixed;
    inset: 0;
    z-index: 10;
    touch-action: none;
}

.panel {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50.5%;
    background: #030303;
    will-change: transform;
}

#top {
    top: 0;
}

#bottom {
    bottom: 0;
}

#line {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    background: #333;
    transform: translateY(-50%);
    pointer-events: none;
}

#handle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    border: 1px solid #444;
    border-radius: 50%;
    background: #080808;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
}

#handle:active {
    cursor: grabbing;
}

#handle span {
    width: 4px;
    height: 4px;
    background: #aaa;
    border-radius: 50%;
}

#opening.dragging #handle {
    border-color: #aaa;
}

#opening.releasing .panel {
    transition: transform 1s cubic-bezier(.76,0,.24,1);
}

#opening.releasing #handle,
#opening.releasing #line {
    opacity: 0;
    transition: opacity .3s;
}

#opening.finished {
    display: none;
}
</style>
</head>
<body>

<main id="website">
    <nav class="home">
        <a href="#">HOME</a>
    </nav>
</main>

<div id="opening">
    <div class="panel" id="top"></div>
    <div class="panel" id="bottom"></div>
    <div id="line"></div>
    <div id="handle"><span></span></div>
</div>

<script>
const opening = document.getElementById("opening");
const topPanel = document.getElementById("top");
const bottomPanel = document.getElementById("bottom");
const handle = document.getElementById("handle");
const line = document.getElementById("line");

let dragging = false;
let opened = false;
let startY = 0;
let pull = 0;
let pointerId = null;

const threshold = () => innerHeight * .23;
const maximum = () => innerHeight * .48;

function update(value) {
    pull = Math.max(0, Math.min(value, maximum()));

    const progress = pull / maximum();

    topPanel.style.transform = `translateY(${-pull}px)`;
    bottomPanel.style.transform = `translateY(${pull}px)`;

    handle.style.top = `calc(50% + ${pull}px)`;
    handle.style.scale = 1 + progress * .1;

    line.style.transform = `translateY(${pull}px)`;
}

function reset() {
    topPanel.style.transition = "transform .7s cubic-bezier(.2,.8,.2,1)";
    bottomPanel.style.transition = "transform .7s cubic-bezier(.2,.8,.2,1)";
    handle.style.transition = "top .7s ease, scale .3s";
    line.style.transition = "transform .7s ease";

    update(0);
    opening.classList.remove("dragging");

    setTimeout(() => {
        if (opened) return;
        topPanel.style.transition = "";
        bottomPanel.style.transition = "";
        handle.style.transition = "";
        line.style.transition = "";
    }, 750);
}

function reveal() {
    if (opened) return;

    opened = true;
    dragging = false;
    opening.classList.add("releasing");

    topPanel.style.transform = "translateY(-110vh)";
    bottomPanel.style.transform = "translateY(110vh)";

    setTimeout(() => {
        opening.classList.add("finished");
        document.body.style.overflow = "hidden";
    }, 1050);
}

handle.addEventListener("pointerdown", e => {
    if (opened || dragging) return;

    dragging = true;
    startY = e.clientY;
    pointerId = e.pointerId;
    handle.setPointerCapture(pointerId);
    opening.classList.add("dragging");
});

handle.addEventListener("pointermove", e => {
    if (!dragging || opened || e.pointerId !== pointerId) return;
    update(e.clientY - startY);
});

function release(e) {
    if (!dragging || opened) return;
    if (e.pointerId !== pointerId) return;

    dragging = false;
    pointerId = null;

    if (pull >= threshold()) reveal();
    else reset();
}

handle.addEventListener("pointerup", release);
handle.addEventListener("pointercancel", release);
</script>
</body>
</html>
