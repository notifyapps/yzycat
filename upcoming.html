<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>coming soon</title>
<meta name="description" content="coming soon">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="coming soon">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='black'/><text x='50' y='68' font-size='58' font-family='Arial' font-weight='800' text-anchor='middle' fill='white'>y</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #000;
    --fg: #f2f2f2;
    --mute: #8a8a8a;
    --line: #292929;
    --font: "Syne", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.65, 0, .25, 1);
    --mx: 50%;
    --my: 50%;
    --pad: 5vw;
    --accent: 255, 255, 255;
    --spot-a: .06;
    color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; background: #000; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
}

a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 4px;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    opacity: .04;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

#website {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding:
        max(28px, env(safe-area-inset-top, 0px))
        max(var(--pad), env(safe-area-inset-right, 0px))
        max(28px, env(safe-area-inset-bottom, 0px))
        max(var(--pad), env(safe-area-inset-left, 0px));
    background:
        var(--bg);
}

.top { display: flex; align-items: center; }
nav { display: flex; gap: 6px; font-size: 13px; letter-spacing: .04em; }
nav a {
    color: var(--mute);
    text-decoration: none;
    position: relative;
    padding: 12px 11px;
    margin: -12px 0 -12px -11px;
    transition: color .2s;
}
nav a::after {
    content: "";
    position: absolute;
    left: 11px; right: 11px; bottom: 8px;
    height: 1px;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
}
nav a[aria-current] { color: var(--fg); }
nav a[aria-current]::after { transform: scaleX(1); }

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
}
.hero h1 {
    font-weight: 800;
    font-size: clamp(44px, min(13vw, 24vh), 200px);
    line-height: .85;
    letter-spacing: -.045em;
    margin-left: -.04em;
    white-space: nowrap;
}
.hero h1 span {
    display: inline-block;
    transition: opacity 1.4s ease;
}
body:not(.landed) .hero h1 span { opacity: 0; }

.stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    margin: 18px 0 22px;
}
.listwrap { width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
.eyebrow {
    font-size: 12px;
    letter-spacing: .16em;
    color: var(--mute);
    margin-bottom: 14px;
    flex: none;
    opacity: 0;
    transition: opacity 1.4s ease .5s;
}
body.landed .eyebrow { opacity: 1; }
.eyebrow::before {
    content: "";
    display: block;
    width: 28px;
    height: 1px;
    background: var(--mute);
    margin-bottom: 18px;
}
.ctl { display: flex; align-items: center; gap: 4px; flex: none; }
.skip {
    width: 30px;
    height: 30px;
    border: 0;
    background: none;
    color: var(--mute);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: color .3s ease;
}
.skip svg { width: 14px; height: 14px; fill: currentColor; }

.np {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 10px 14px 10px 10px;
    border-radius: 18px;
    background: rgba(14, 14, 14, .72);
    border: 1px solid #ffffff14;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 0 48px rgba(var(--accent), .04);
}
.npwrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    width: min(380px, 100%);
    flex: none;
}
.np .art {
    position: relative;
    width: 62px;
    height: 62px;
    flex: none;
    border-radius: 11px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a1a, #0b0b0b);
    display: grid;
    place-items: center;
    color: var(--mute);
    font-size: 22px;
}
.np .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.np .eq {
    position: absolute;
    left: 7px;
    bottom: 7px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    opacity: 0;
    transition: opacity .3s ease;
    filter: drop-shadow(0 0 4px #000c);
}
.np .eq i { display: block; width: 2px; height: 3px; background: #fff; }
.np.playing .eq { opacity: 1; }
.np.playing .eq i { animation: eq 1.3s ease-in-out infinite alternate; }
.np .eq i:nth-child(2) { animation-delay: -.3s; }
.np .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }
.np .info { flex: 1; min-width: 0; }
.np .t, .np .a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .t { font-size: 14px; font-weight: 500; letter-spacing: -.01em; color: var(--fg); }
.np .a { font-size: 12px; color: var(--mute); margin-top: 2px; letter-spacing: .02em; }
.np .time {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--mute);
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
}
.np input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 16px;
    margin-top: 4px;
    background: transparent;
    cursor: pointer;
    touch-action: none;
}
.np input[type=range]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--fg) var(--p, 0%), var(--line) var(--p, 0%));
}
.np input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px; height: 8px;
    margin-top: -3px;
    border-radius: 50%;
    background: var(--fg);
    border: 0;
}
.np input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: var(--line); }
.np input[type=range]::-moz-range-progress { height: 2px; border-radius: 2px; background: var(--fg); }
.np input[type=range]::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); border: 0; }
#npPlay {
    flex: none;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: var(--fg);
    color: #000;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .2s ease;
}
#npPlay:active { transform: scale(.94); }
#npPlay svg { width: 16px; height: 16px; fill: currentColor; grid-area: 1 / 1; }
#npPlay .i-pause { display: none; }
.np.playing #npPlay .i-pause { display: block; }
.np.playing #npPlay .i-play { display: none; }

.top, .np {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.4s ease .1s, transform 1.4s ease .1s;
}
body.landed .top, body.landed .np.ready { opacity: 1; transform: none; }

@media (hover: hover) {
    nav a:hover { color: var(--fg); }
    nav a:hover::after { transform: scaleX(1); }
    .skip:hover { color: var(--fg); }
}
@media (max-width: 700px) {
    :root { --pad: 6vw; }
    .bottom { flex-direction: column; align-items: stretch; gap: 18px; }
    .npwrap { order: -1; width: 100%; align-items: stretch; }
}
@media (max-width: 420px) {
    nav { font-size: 12px; }
    .np { gap: 10px; padding-right: 8px; }
    .np .art { width: 54px; height: 54px; }
}
@media (max-height: 480px) and (orientation: landscape) {
    #website { padding-top: max(18px, env(safe-area-inset-top, 0px)); padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 1600px) {
    nav { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
    .top, .np, .eyebrow, .hero h1 span { transition: none !important; }
    .np.playing .eq i { animation: none !important; }
}
</style>
</head>

<body>

<audio id="music" preload="auto" playsinline></audio>

<main id="website">
    <div class="top">
        <nav aria-label="Main">
            <a href="index.html">home</a>
            <a href="upcoming.html" aria-current="page">coming soon</a>
            <a href="#">contact</a>
        </nav>
    </div>

    <div class="stage">
        <div class="listwrap">
            <p class="eyebrow">coming soon</p>
        </div>
    </div>

    <div class="bottom">
        <header class="hero">
            <h1 aria-label="yzycat"><span aria-hidden="true">y</span><span aria-hidden="true">z</span><span aria-hidden="true">y</span><span aria-hidden="true">c</span><span aria-hidden="true">a</span><span aria-hidden="true">t</span></h1>
        </header>
        <div class="npwrap">
            <aside class="np" id="np" aria-label="Now playing">
                <div class="art" aria-hidden="true">
                    <span id="artFallback">&#9834;</span>
                    <img id="artImg" alt="" hidden>
                    <div class="eq"><i></i><i></i><i></i></div>
                </div>
                <div class="info">
                    <div class="t" id="npTitle"></div>
                    <div class="a" id="npArtist"></div>
                    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
                    <div class="time" aria-hidden="true"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
                </div>
                <div class="ctl">
                <button class="skip" id="prev" type="button" aria-label="Previous track">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
                </button>
                <button id="npPlay" type="button" aria-label="Play or pause">
                    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                </button>
                <button class="skip" id="next" type="button" aria-label="Next track">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
                </button>
            </div>
            </aside>
        </div>
    </div>
</main>

<script>
const site = document.getElementById("website");
const music = document.getElementById("music");

const VOLUME = 0.6;
let completed = true;
let wantsSound = true, fadeTimer = null;

try { if (localStorage.getItem("yzycat-sound") === "off") wantsSound = false; } catch (e) {}

let actx = null, lowpass = null, duck = null, master = null;
let graph = false, graphTried = false, muffle = 0, awayTimer = null;
const CUTOFF = [20000, 900, 240];
const DUCK = [1, 0.8, 0.55];

function ensureGraph() {
    if (graph) {
        if (actx.state === "suspended") actx.resume().catch(() => {});
        return;
    }
    if (graphTried) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    const ua = navigator.userActivation;
    if (!AC || !ua || !ua.hasBeenActive) return;
    graphTried = true;
    try {
        actx = new AC();
        const source = actx.createMediaElementSource(music);
        lowpass = actx.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = CUTOFF[muffle];
        lowpass.Q.value = 0.8;
        duck = actx.createGain();
        duck.gain.value = DUCK[muffle];
        master = actx.createGain();
        master.gain.value = music.volume;
        source.connect(lowpass);
        lowpass.connect(duck);
        duck.connect(master);
        master.connect(actx.destination);
        music.volume = 1;
        graph = true;
        if (actx.state === "suspended") actx.resume().catch(() => {});
    } catch (e) {
        graph = false;
    }
}

["pointerup", "touchend", "keydown", "click"].forEach(ev => document.addEventListener(ev, ensureGraph, true));

function getLevel() { return graph ? master.gain.value : music.volume; }
function setLevel(v) {
    v = Math.max(0, Math.min(1, v));
    if (graph) master.gain.value = v;
    else music.volume = v;
}

function applyMuffle(level, ms) {
    muffle = level;
    if (graph) {
        const t = actx.currentTime, d = ms / 1000;
        lowpass.frequency.cancelScheduledValues(t);
        lowpass.frequency.setValueAtTime(Math.max(60, lowpass.frequency.value), t);
        lowpass.frequency.exponentialRampToValueAtTime(CUTOFF[level], t + d);
        duck.gain.cancelScheduledValues(t);
        duck.gain.setValueAtTime(duck.gain.value, t);
        duck.gain.linearRampToValueAtTime(DUCK[level], t + d);
    } else {
        fadeTo(VOLUME * (level === 0 ? 1 : level === 1 ? 0.5 : 0.25), ms);
    }
}

function fadeTo(target, ms, done) {
    clearInterval(fadeTimer);
    const start = getLevel(), t0 = performance.now();
    fadeTimer = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        setLevel(start + (target - start) * k);
        if (k >= 1) { clearInterval(fadeTimer); if (done) done(); }
    }, 30);
}

function playMusic(ms) {
    ensureGraph();
    setLevel(0);
    const p = music.play();
    return (p && p.then ? p : Promise.resolve()).then(() => fadeTo(VOLUME, ms || 1200));
}

function toggleMusic() {
    if (music.paused) {
        wantsSound = true;
        playMusic(800).catch(() => {});
    } else {
        wantsSound = false;
        fadeTo(0, 400, () => music.pause());
    }
    try { localStorage.setItem("yzycat-sound", wantsSound ? "on" : "off"); } catch (e) {}
}

function startMusic() {
    if (!wantsSound) return;
    playMusic(2500).catch(() => {
        const retry = e => {
            document.removeEventListener("pointerup", retry, true);
            document.removeEventListener("touchend", retry, true);
            document.removeEventListener("keydown", retry, true);
            if (e && e.target && e.target.closest && e.target.closest("#npPlay, .row, .skip, #seek")) return;
            if (wantsSound && music.paused) playMusic(2500).catch(() => {});
        };
        document.addEventListener("pointerup", retry, true);
        document.addEventListener("touchend", retry, true);
        document.addEventListener("keydown", retry, true);
    });
}

function goAway() {
    if (music.paused) return;
    applyMuffle(1, 600);
    clearTimeout(awayTimer);
    awayTimer = setTimeout(() => {
        if (document.hidden && !music.paused) applyMuffle(2, 1500);
    }, 6000);
}

function comeBack() {
    clearTimeout(awayTimer);
    applyMuffle(0, 500);
    if (wantsSound && music.paused && completed) music.play().catch(() => {});
}

document.addEventListener("visibilitychange", () => {
    if (!completed) return;
    if (document.hidden) goAway();
    else comeBack();
});

function moveSpot(e) {
    site.style.setProperty("--mx", e.clientX + "px");
    site.style.setProperty("--my", e.clientY + "px");
}
site.addEventListener("pointermove", moveSpot);
site.addEventListener("pointerdown", moveSpot);

requestAnimationFrame(() => requestAnimationFrame(() => {
    document.body.classList.add("landed");
}));

document.addEventListener("keydown", e => {
    if (!completed || e.code !== "Space") return;
    const t = e.target;
    if (t && (t.tagName === "BUTTON" || t.tagName === "INPUT" || t.tagName === "A")) return;
    e.preventDefault();
    toggleMusic();
});

function syncsafe(b, o) { return ((b[o] & 127) << 21) | ((b[o + 1] & 127) << 14) | ((b[o + 2] & 127) << 7) | (b[o + 3] & 127); }

function decodeText(bytes, enc) {
    try {
        let t;
        if (enc === 1) {
            if (bytes[0] === 0xFE && bytes[1] === 0xFF) t = new TextDecoder("utf-16be").decode(bytes.subarray(2));
            else if (bytes[0] === 0xFF && bytes[1] === 0xFE) t = new TextDecoder("utf-16le").decode(bytes.subarray(2));
            else t = new TextDecoder("utf-16le").decode(bytes);
        } else if (enc === 2) t = new TextDecoder("utf-16be").decode(bytes);
        else if (enc === 3) t = new TextDecoder("utf-8").decode(bytes);
        else t = new TextDecoder("iso-8859-1").decode(bytes);
        return t.replace(/\0+$/, "").replace(/\0/g, ", ").trim();
    } catch (e) { return ""; }
}

function endOfString(d, from, enc) {
    if (enc === 1 || enc === 2) {
        for (let i = from; i + 1 < d.length; i += 2) if (d[i] === 0 && d[i + 1] === 0) return i;
        return d.length;
    }
    for (let i = from; i < d.length; i++) if (d[i] === 0) return i;
    return d.length;
}

function parsePicture(d, v2) {
    const enc = d[0];
    let pos = 1, mime;
    if (v2) {
        const f = String.fromCharCode(d[1], d[2], d[3]).toUpperCase();
        mime = f === "PNG" ? "image/png" : "image/jpeg";
        pos = 4;
    } else {
        const e = endOfString(d, 1, 0);
        mime = new TextDecoder("iso-8859-1").decode(d.subarray(1, e)).toLowerCase();
        if (!mime.includes("/")) mime = "image/" + (mime || "jpeg");
        if (mime === "image/jpg") mime = "image/jpeg";
        pos = e + 1;
    }
    pos += 1;
    const de = endOfString(d, pos, enc);
    pos = de + (enc === 1 || enc === 2 ? 2 : 1);
    return { mime, data: d.subarray(pos) };
}

function parseID3(buf) {
    let b = new Uint8Array(buf);
    const out = {};
    if (b.length < 10 || b[0] !== 0x49 || b[1] !== 0x44 || b[2] !== 0x33) return out;
    const ver = b[3], flags = b[5];
    let body = b.subarray(10, Math.min(b.length, 10 + syncsafe(b, 6)));
    if (flags & 0x80) {
        const r = [];
        for (let i = 0; i < body.length; i++) {
            r.push(body[i]);
            if (body[i] === 0xFF && body[i + 1] === 0) i++;
        }
        body = Uint8Array.from(r);
    }
    let pos = 0;
    if (flags & 0x40 && ver >= 3) {
        const sz = ver === 4 ? syncsafe(body, 0) : (((body[0] << 24) | (body[1] << 16) | (body[2] << 8) | body[3]) >>> 0) + 4;
        pos = sz;
    }
    const v2 = ver === 2;
    const hdr = v2 ? 6 : 10;
    while (pos + hdr <= body.length) {
        if (body[pos] === 0) break;
        const id = String.fromCharCode(...body.subarray(pos, pos + (v2 ? 3 : 4)));
        let size;
        if (v2) size = (body[pos + 3] << 16) | (body[pos + 4] << 8) | body[pos + 5];
        else if (ver === 4) size = syncsafe(body, pos + 4);
        else size = ((body[pos + 4] << 24) | (body[pos + 5] << 16) | (body[pos + 6] << 8) | body[pos + 7]) >>> 0;
        let start = pos + hdr;
        if (ver === 4 && (body[pos + 9] & 1)) { start += 4; size -= 4; }
        if (size <= 0 || start + size > body.length) break;
        const data = body.subarray(start, start + size);
        if (id === "TIT2" || id === "TT2") out.title = decodeText(data.subarray(1), data[0]);
        else if (id === "TPE1" || id === "TP1") out.artist = decodeText(data.subarray(1), data[0]);
        else if (id === "TALB" || id === "TAL") out.album = decodeText(data.subarray(1), data[0]);
        else if ((id === "APIC" || id === "PIC") && !out.picture) out.picture = parsePicture(data, v2);
        pos = start + size;
    }
    return out;
}

async function readTags(url) {
    const res = await fetch(url, { headers: { Range: "bytes=0-9" } });
    let buf = await res.arrayBuffer();
    if (buf.byteLength <= 10) {
        const h = new Uint8Array(buf);
        if (h[0] !== 0x49 || h[1] !== 0x44 || h[2] !== 0x33) return {};
        const total = syncsafe(h, 6) + 10 + ((h[5] & 0x10) ? 10 : 0);
        const r2 = await fetch(url, { headers: { Range: "bytes=0-" + (total - 1) } });
        buf = await r2.arrayBuffer();
    }
    return parseID3(buf);
}

const np = document.getElementById("np");
const npTitle = document.getElementById("npTitle");
const npArtist = document.getElementById("npArtist");
const artImg = document.getElementById("artImg");
const artFallback = document.getElementById("artFallback");
const seek = document.getElementById("seek");
const tCur = document.getElementById("tCur");
const tDur = document.getElementById("tDur");
let seeking = false;

function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
}

function syncCard() {
    np.classList.toggle("playing", !music.paused);
    const d = music.duration;
    if (!seeking && isFinite(d) && d > 0) {
        const v = music.currentTime / d * 1000;
        seek.value = v;
        seek.style.setProperty("--p", (v / 10) + "%");
        tCur.textContent = fmt(music.currentTime);
    }
    if (isFinite(d)) tDur.textContent = fmt(d);
}

["play", "pause", "timeupdate", "loadedmetadata", "durationchange", "seeked"].forEach(ev => music.addEventListener(ev, syncCard));

document.getElementById("npPlay").addEventListener("click", toggleMusic);

seek.addEventListener("input", () => {
    seeking = true;
    const d = music.duration;
    seek.style.setProperty("--p", (seek.value / 10) + "%");
    if (isFinite(d)) tCur.textContent = fmt(seek.value / 1000 * d);
});
seek.addEventListener("change", () => {
    const d = music.duration;
    if (isFinite(d)) music.currentTime = seek.value / 1000 * d;
    seeking = false;
});

const MUSIC_DIR = "yzyupcomingmusic/";
const CARD_TITLE = "everything.";
const CARD_ARTIST = "ye";
let files = [], tracks = [], cur = -1;

function fallbackTitle(f) {
    let n = f;
    try { n = decodeURIComponent(f); } catch (e) {}
    return n.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
}

function trackSrc(i) { return MUSIC_DIR + encodeURIComponent(files[i]); }

function accentFrom(img) {
    try {
        const c = document.createElement("canvas");
        c.width = c.height = 24;
        const x = c.getContext("2d", { willReadFrequently: true });
        x.drawImage(img, 0, 0, 24, 24);
        const d = x.getImageData(0, 0, 24, 24).data;
        let r = 0, g = 0, b = 0, w = 0;
        for (let i = 0; i < d.length; i += 4) {
            const max = Math.max(d[i], d[i + 1], d[i + 2]), min = Math.min(d[i], d[i + 1], d[i + 2]);
            const sat = max ? (max - min) / max : 0;
            const wt = sat * sat * (max / 255) + 0.001;
            r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt;
        }
        r /= w; g /= w; b /= w;
        const m = Math.max(r, g, b);
        if (m < 40) return;
        const k = 220 / m;
        const root = document.documentElement.style;
        root.setProperty("--accent", Math.min(255, Math.round(r * k)) + ", " + Math.min(255, Math.round(g * k)) + ", " + Math.min(255, Math.round(b * k)));
        root.setProperty("--spot-a", ".1");
    } catch (e) {}
}

function resetAccent() {
    const root = document.documentElement.style;
    root.setProperty("--accent", "255, 255, 255");
    root.setProperty("--spot-a", ".06");
}

function applyCard() {
    const t = tracks[cur] || { title: "coming soon", artist: "" };
    npTitle.textContent = CARD_TITLE;
    npArtist.textContent = CARD_ARTIST;
    if (t.picture && t.picture.data.length) {
        if (!t.artUrl) t.artUrl = URL.createObjectURL(new Blob([t.picture.data], { type: t.picture.mime }));
        artImg.onload = () => { artImg.hidden = false; artFallback.hidden = true; accentFrom(artImg); };
        artImg.src = t.artUrl;
    } else {
        artImg.hidden = true;
        artFallback.hidden = false;
        resetAccent();
    }
    np.classList.add("ready");
    if ("mediaSession" in navigator && window.MediaMetadata) {
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: CARD_TITLE,
                artist: CARD_ARTIST,
                album: "",
                artwork: t.artUrl ? [{ src: t.artUrl, sizes: "512x512", type: t.picture.mime }] : []
            });
            navigator.mediaSession.setActionHandler("play", () => { if (music.paused) toggleMusic(); });
            navigator.mediaSession.setActionHandler("pause", () => { if (!music.paused) toggleMusic(); });
            navigator.mediaSession.setActionHandler("previoustrack", () => go((cur - 1 + files.length) % files.length, true));
            navigator.mediaSession.setActionHandler("nexttrack", () => go((cur + 1) % files.length, true));
            navigator.mediaSession.setActionHandler("seekto", d => { if (d && isFinite(d.seekTime)) music.currentTime = d.seekTime; });
        } catch (e) {}
    }
}

function select(i) {
    cur = i;
    music.src = trackSrc(i);
    seek.value = 0;
    seek.style.setProperty("--p", "0%");
    tCur.textContent = "0:00";
    tDur.textContent = "0:00";
    applyCard();
}

function go(i, play) {
    if (!files.length) return;
    select(i);
    if (play) {
        wantsSound = true;
        try { localStorage.setItem("yzycat-sound", "on"); } catch (e) {}
        ensureGraph();
        setLevel(VOLUME);
        music.play().catch(() => {});
    }
}

document.getElementById("prev").addEventListener("click", () => {
    if (!files.length) return;
    if (music.currentTime > 4) music.currentTime = 0;
    else go((cur - 1 + files.length) % files.length, true);
});
document.getElementById("next").addEventListener("click", () => { if (files.length) go((cur + 1) % files.length, true); });
music.addEventListener("ended", () => { if (files.length) go((cur + 1) % files.length, true); });

const REPO = "notifyapps/yzycat";
const AUDIO_RE = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm)$/i;
const LIST_KEY = "yzycat-upcoming-list";

function cleanNames(list) {
    return (Array.isArray(list) ? list : [])
        .filter(n => typeof n === "string" && AUDIO_RE.test(n))
        .map(n => n.split("/").pop());
}

function sortNames(list) {
    return list.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));
}

async function fromGithub() {
    const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + MUSIC_DIR.replace(/\/$/, ""), {
        headers: { Accept: "application/vnd.github+json" }
    });
    if (!r.ok) throw new Error("api");
    const items = await r.json();
    return sortNames(cleanNames(items.filter(i => i.type === "file").map(i => i.name)));
}

async function fromManifest() {
    const r = await fetch(MUSIC_DIR + "files.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("manifest");
    return cleanNames(await r.json());
}

async function fromListing() {
    const r = await fetch(MUSIC_DIR, { cache: "no-cache" });
    if (!r.ok) throw new Error("listing");
    const html = await r.text();
    const out = [];
    html.replace(/href="([^"#?]+)"/g, (m, h) => {
        try { out.push(decodeURIComponent(h.split("/").pop())); } catch (e) {}
        return m;
    });
    return sortNames(cleanNames(out));
}

async function discoverFiles() {
    for (const source of [fromGithub, fromManifest, fromListing]) {
        try {
            const list = await source();
            if (list.length) {
                try { localStorage.setItem(LIST_KEY, JSON.stringify(list)); } catch (e) {}
                return list;
            }
        } catch (e) {}
    }
    try { return cleanNames(JSON.parse(localStorage.getItem(LIST_KEY) || "[]")); } catch (e) { return []; }
}

async function loadPlaylist() {
    files = await discoverFiles();
    tracks = files.map(f => ({ file: f, title: fallbackTitle(f), artist: "" }));
    if (files.length) select(0);
    else applyCard();
    files.forEach((f, i) => {
        readTags(trackSrc(i)).then(t => {
            tracks[i].title = t.title || tracks[i].title;
            tracks[i].artist = t.artist || "";
            tracks[i].album = t.album || "";
            tracks[i].picture = t.picture || null;
            if (i === cur) applyCard();
        }).catch(() => {});
    });
    if (completed) startMusic();
}

loadPlaylist();
